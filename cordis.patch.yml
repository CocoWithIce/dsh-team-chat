# dsh-team-chat bundle patch
#
# This file is the `dsh.bundle.patch` layer of the package: when the plugin is
# installed through the official CLI —
#
#   dsh plugin --profile <name> add dsh-team-chat@<version>
#
# — the command reconciles `dsh.profile.bundles` against installed packages and,
# seeing this declaration, appends `dsh-team-chat` to the bundle stack. The
# profile boot then merges THIS patch (a single `insert` of the plugin row)
# exactly like a manual cordis.patch.yml mount line, so no profile file edits
# are needed.
#
# The row carries no config: every user-facing option lives in the sidebar tab's
# own settings page (better-sidebar `pluginSettings['team-chat']`).
- insert:
    - id: team-chat
      name: 'dsh-team-chat'
